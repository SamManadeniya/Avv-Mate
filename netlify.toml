[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Netlify Serverless API redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' blob: data: https://* https://images.unsplash.com https://*.googleusercontent.com; frame-src 'self' https://accounts.google.com https://content.googleapis.com; connect-src 'self' https://rxbjexoxyfownnwxzbjn.supabase.co https://*.supabase.co wss://rxbjexoxyfownnwxzbjn.supabase.co wss://*.supabase.co https://*.googleapis.com https://googleapis.com https://accounts.google.com https://apis.google.com;"

